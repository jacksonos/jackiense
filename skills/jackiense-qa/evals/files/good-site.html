<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northwind Studio</title>
<style>
:root {
  --ground:#0b0c10; --surface:#14161d; --ink:#eef0f6; --ink-muted:#b9becf; --line:rgba(255,255,255,.14);
  --accent:#5df0a8; --accent-ink:#04120c;
  --font-display:'Georgia',serif; --font-sans:'Inter',sans-serif; --ease:cubic-bezier(.16,1,.3,1);
}
* { box-sizing:border-box; }
body { margin:0; font-family:var(--font-sans); font-size:17px; line-height:1.6; color:var(--ink); background:var(--ground); }
.hero { padding:96px 24px 64px; max-width:1100px; margin:0 auto; }
h1 { font-family:var(--font-display); font-weight:400; font-size:clamp(40px,7vw,88px); line-height:1.04; margin:0 0 24px; letter-spacing:-0.02em;
     animation:rise .8s var(--ease) both; }
.lead { color:var(--ink-muted); max-width:46ch; margin:0 0 32px; }
.btn { display:inline-flex; align-items:center; min-height:48px; padding:0 28px; border-radius:999px; background:var(--accent);
       color:var(--accent-ink); font-weight:600; text-decoration:none; transition:transform .3s var(--ease); }
.btn:hover { transform:translateY(-2px); }
.btn:focus-visible, a:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:24px; margin:0 24px 24px; }
.card p { margin:0; color:var(--ink-muted); }
@keyframes rise { from { transform:translateY(24px); opacity:0 } to { transform:none; opacity:1 } }
@media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<header class="hero">
  <h1>We build calm software for loud companies</h1>
  <p class="lead">A small studio for products that last. Strategy, design and engineering under one roof.</p>
  <a class="btn" href="#work">See our work</a>
</header>
<main id="work">
  <article class="card"><img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="Atlas case study cover" width="1" height="1"><p>Case study: Atlas, a logistics platform.</p></article>
</main>
</body>
</html>
